<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>쓰담토닥</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="workspace">
        <section class="settings-panel" aria-label="재생 설정">
          <div class="empty-settings" id="emptySettings">트랙을 선택해주세요</div>
          <div class="settings-content" id="settingsContent" hidden>
            <p class="eyebrow">재생 설정</p>
            <h1 id="selectedTrackName"></h1>
            <div class="setting-row">
              <div>
                <strong>재생 순서</strong>
                <small id="playModeDescription">매번 다른 소리로 재생</small>
              </div>
              <button class="mode-toggle" id="modeToggle" type="button" role="switch" aria-checked="true">
                <span>랜덤</span>
              </button>
            </div>
            <p class="track-sounds" id="trackSounds"></p>
          </div>
        </section>

        <section class="track-panel" aria-label="트랙 목록">
          <header>
            <p class="eyebrow">오늘의 소리</p>
            <h2>트랙 목록</h2>
          </header>
          <div class="track-list" id="trackList"></div>
          <button class="side-action settings-button" id="globalSettingsButton" type="button" aria-label="전역 설정 열기"><img src="../Resources/Icon/config.png" alt="" /></button>
          <button class="side-action blackout-button" id="blackoutButton" type="button" aria-label="취침 모드"><img src="../Resources/Icon/sleep_mode.png" alt="" /></button>
        </section>
      </section>

      <footer class="player" aria-label="재생 컨트롤">
        <div class="progress-area">
          <input id="progressSlider" class="progress-slider" type="range" min="0" max="1800" value="0" step="0.1" aria-label="재생 위치" disabled />
        </div>
        <div class="player-controls">
          <button class="play-button" id="playButton" type="button" aria-label="재생" disabled><span class="play-icon"></span></button>
          <div class="time-display"><strong id="elapsedTime">0:00</strong><span>/</span><span id="totalTime">30:00</span></div>
          <div class="control-spacer"></div>
          <div class="inline-volume"><input id="volumeSlider" type="range" min="0" max="2" value="1" step="0.01" aria-label="전체 음량" /></div>
          <button class="inline-choice speed-select" id="speedControl" type="button">x1.0</button>
          <button class="inline-choice duration-select" id="durationControl" type="button">30 min</button>
        </div>
      </footer>
    </main>

    <button class="blackout-screen" id="blackoutScreen" type="button" aria-label="화면 다시 표시" hidden></button>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow">전역 설정</p><h2>설정</h2></div>
          <button class="close-button" value="close" aria-label="닫기">×</button>
        </div>
        <p class="dialog-help">이 설정은 현재 기기에 자동 저장됩니다.</p>
        <h3 class="dialog-section-title">고정 파일 선택</h3>
        <div id="fixedFileSettings"></div>
        <button class="done-button" value="close">완료</button>
      </form>
    </dialog>

    <dialog class="choice-dialog" id="choiceDialog">
      <form method="dialog">
        <div class="dialog-header">
          <div><p class="eyebrow" id="choiceEyebrow">재생 설정</p><h2 id="choiceTitle">선택</h2></div>
          <button class="close-button" value="close" aria-label="닫기">×</button>
        </div>
        <div class="choice-options" id="choiceOptions"></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
